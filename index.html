<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM Zulqurnain — Motion Desktop</title>
<meta name="description" content="Portfolio of SM Zulqurnain, motion designer. Social, TVC and launch work for Perodua, MG, Proton, KFC, Pantene and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- wobbly hand-drawn grid -->
<svg class="grid-bg" aria-hidden="true">
  <defs>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="22"/></filter>
    <pattern id="cells" width="118" height="92" patternUnits="userSpaceOnUse">
      <path d="M118 0V92M0 92H118" fill="none" stroke="var(--grid-line)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="-40" y="-40" width="calc(100% + 80px)" height="calc(100% + 80px)" fill="url(#cells)" filter="url(#wobble)"/>
</svg>

<!-- menu bar -->
<header class="menubar">
  <div class="mb-left">
    <button class="mb-logo" data-open="terminal" aria-label="Open terminal" title="Terminal"><span></span><span></span></button>
    <nav>
      <button data-open="work">Featured</button>
      <button data-folder="social">Social</button>
      <button data-folder="tvc">TVC</button>
      <button data-folder="events">Events</button>
      <button data-folder="hobby">Hobby</button>
    </nav>
  </div>
  <div class="mb-right"><button class="wall" id="wall" title="Change wallpaper" aria-label="Change wallpaper"></button><span class="battery"><i></i></span><span id="clock">—</span></div>
</header>

<!-- centre widget: profile, clock, now playing -->
<section class="widget" aria-label="Desktop widget" hidden>
  <button class="wg wg-profile" data-open="about">
    <span class="wg-avatar"></span>
    <span><b class="wg-handle"></b><span class="wg-role"></span></span>
  </button>
  <div class="wg wg-clock" aria-live="off">
    <span class="wg-day"><b></b><span></span></span>
    <span class="wg-time"></span><span class="wg-ampm"></span>
  </div>
  <button class="wg wg-now">
    <span class="wg-art"><img alt=""></span>
    <span class="wg-label"><i></i><i></i><i></i>Now playing</span>
    <span class="wg-title"></span><b class="wg-client"></b>
  </button>
</section>

<main id="desk"></main>

<!-- dock -->
<footer class="dock-wrap">
  <div class="dock">
    <button data-open="work" title="Work"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="var(--yellow)"/><path d="M5 20h30M20 5c-6 7-6 23 0 30M20 5c6 7 6 23 0 30" fill="none" stroke="var(--ink)" stroke-width="2"/><circle cx="20" cy="20" r="15" fill="none" stroke="var(--ink)" stroke-width="2.4"/></svg></button>
    <button data-open="reel" title="Showreel"><svg viewBox="0 0 40 40"><rect x="5" y="8" width="30" height="24" rx="5" fill="var(--red)" stroke="var(--ink)" stroke-width="2.4"/><path d="M17 14l9 6-9 6z" fill="#fff" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button data-open="finder" title="Folders"><svg viewBox="0 0 40 40"><path d="M5 12a3 3 0 013-3h8l3 4h13a3 3 0 013 3v14a3 3 0 01-3 3H8a3 3 0 01-3-3z" fill="var(--orange)" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/><path d="M5 17h30" stroke="var(--ink)" stroke-width="2"/></svg></button>
    <button data-open="contact" title="Contact"><svg viewBox="0 0 40 40"><rect x="5" y="9" width="30" height="22" rx="3" fill="var(--blue-soft)" stroke="var(--ink)" stroke-width="2.4"/><path d="M6 11l14 11 14-11" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
  </div>
</footer>

<template id="win-tpl">
  <article class="win" role="dialog">
    <div class="win-bar">
      <div class="dots"><button class="dot close" aria-label="Close"></button><button class="dot min" aria-label="Minimise"></button><button class="dot max" aria-label="Maximise"></button></div>
      <h2 class="win-title"></h2>
    </div>
    <div class="win-body"></div>
    <div class="win-foot"></div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
