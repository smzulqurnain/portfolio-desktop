# Pages CMS config: https://pagescms.org/docs
# Sign in at https://app.pagescms.org with GitHub and pick this repo.

media:
  input: assets
  output: assets

content:
  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        description: Top of the list shows first on the site. Drag to reorder.
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: client
            label: Client
            description: Use "Personal" for your own projects.
            type: string
          - name: category
            label: Folder
            type: select
            required: true
            options:
              values:
                - { value: social, label: Social }
                - { value: tvc, label: TVC }
                - { value: events, label: Events }
                - { value: hobby, label: Hobby }
          - name: thumbnail
            label: Thumbnail (16:9, about 640×360)
            type: image
            required: true
          - name: blocks
            label: Post content
            description: Shown in order inside the project window. Add a block, pick its type, and fill in only the matching field.
            type: object
            list: true
            fields:
              - name: kind
                label: Block type
                type: select
                required: true
                options:
                  values:
                    - { value: text, label: Text }
                    - { value: image, label: Image }
                    - { value: gallery, label: Image row (several images) }
                    - { value: video, label: Video }
              - name: text
                label: Text
                description: For Text blocks. A short line shows as a heading. Leave a blank line between paragraphs.
                type: text
              - name: image
                label: Image
                description: For Image blocks.
                type: image
              - name: images
                label: Images
                description: For Image row blocks.
                type: image
                list: true
              - name: video
                label: Video link
                description: For Video blocks. A Vimeo, YouTube or Behance/Adobe video embed link.
                type: string
              - name: shape
                label: Video shape
                type: select
                options:
                  values:
                    - { value: wide, label: "Wide 16:9" }
                    - { value: square, label: "Square 1:1" }
                    - { value: portrait, label: "Portrait 4:5" }
                    - { value: tall, label: "Tall 9:16 (Reels/TikTok)" }

  - name: site
    label: Site text & links
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: handle, label: Widget handle, type: string }
      - { name: avatar, label: Profile picture (square), type: image }
      - { name: role, label: Role line, type: string }
      - { name: bio, label: About text, type: text }
      - { name: services, label: Services (terminal line), type: string }
      - { name: email, label: Contact email, type: string }
      - { name: contact_link, label: Contact link (About window button), type: string }
      - { name: showreel_video, label: Showreel video link (Vimeo/YouTube, plays in window), type: string }
      - { name: showreel_link, label: Showreel button link, type: string }
      - { name: showreel_poster, label: Showreel poster image, type: image }
      - { name: behance, label: Behance, type: string }
      - { name: linkedin, label: LinkedIn, type: string }
      - { name: vimeo, label: Vimeo, type: string }
      - { name: lastfm, label: Last.fm, type: string }
      - { name: deviantart, label: DeviantArt, type: string }
